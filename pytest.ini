[pytest]
# Directorios donde buscar tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=thirdParty
    --ignore=data
    --ignore=scripts
    
# Marcadores personalizados
markers =
    unit: Unit tests (funciones puras, sin I/O)
    integration: Integration tests (varios componentes)
    slow: Tests lentos (GPU, modelos grandes)
    gpu: Requiere GPU disponible

# Configuración de cobertura (opcional)
# Para activar: pytest --cov
[coverage:run]
source = ovo
omit = 
    */tests/*
    */thirdParty/*
    */__pycache__/*
