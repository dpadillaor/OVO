# OVO Experiments Manifest — Full coverage
#
# Dimensions covered:
#   - fusion_method      : clip | pe-core | pe-spatial | sam3
#   - slam_module        : simulated (GT poses) | orbslam2 | vanilla | gaussian_slam
#   - noise              : none | t=0.001 | t=0.005 | t=0.01 | t=0.05 (r=0.01 fixed)
#                          + rotation-only (t=0, r=0.05)
#                          + translation-only (t=0.01, r=0)
#   - close_loops        : True | False
#   - scenes             : single scene | list of scenes | scenes_list file | (all from dataset config)
#   - dataset            : Replica | ScanNet
#   - stages             : all | run-only | segment+eval | eval-only
#   - rerun_visual_mode  : off | spawn | serve
#                          off   → no live visualization
#                          spawn → launches a local Rerun viewer (default when show_stream=true)
#                          serve → OVO serves on port 9877; connect with rerun viewer from your machine
#
# vis block example (under ovo_config):
#   ovo_config:
#     vis:
#       rerun_visual_mode: serve    # or off / spawn
#
# Use: python scripts/run_experiments_batch.py --preview

default_dataset: Replica

experiments:

