# OVO Experiments Manifest
# This file defines the list of experiments to be run by the Orchestrator.

# Default dataset for the experiments (can be overridden per experiment if necessary)
default_dataset: "Replica"

# List of Experiments
experiments:
  # ---------------------------------------------------------------------------
  # Experiment
  # ---------------------------------------------------------------------------
  - label: "NoLoopClousure"
    scenes_id: "office0"
    stages: ["run", "segment", "eval"]
    ovo_config:
      fusion_method: "clip"
      slam:
        slam_module: "groundtruth"
        close_loops: False
    slam_config:
      noise:
        noise_enabled: False
        translation_noise_std: 0.03
        rotation_noise_std: 0.01
