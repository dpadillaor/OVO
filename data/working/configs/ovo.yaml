project_name: ovo
checkpoint_path: null
use_wandb: False
device: cuda
data:
  frame_limit: -1 # 100 #-1 # for debugging, set to -1 to disable
seed: 0
slam:
  config_path: data/working/configs/slam
  slam_module: vanilla # vanilla | orbslam3 | gaussian_slam | simulated
  use_viewer: False # only used with orbslam3
  close_loops: True # orbslam3: close loops; simulated: run the corrections (always a final one, after which poses are GT)
  save_estimated_cam: True
  simulated: # only used with simulated: GT poses plus controlled errors (ovo/slam/simulated)
    keyframes:
      dist: 0.1 # metres moved since the last keyframe to take a new one
      rot_deg: 5.0 # or degrees turned
    drift: null # per-frame error that accumulates, e.g. {translation_std: 0.01, rotation_std_deg: 0.5, seed: 42}
    jumps: [] # sudden pose errors, e.g. [{at_frame: 300, translation: [0, 0, -0.1], rotation: [5, 0, 0]}]
    jump_seed: 42 # draws the random direction of jumps given as a single number
    correction:
      at_frames: [] # extra corrections (simulated loop closures) besides the one at the end
vis:
  stream: False
  show_stream: False # this is going to be ignored if stream is false
mapping:
  map_every: 5 # ignored if slam.slam_module == orbslam3 (maps every frame)
debug: True
debug_info: True
semantic:
  segment_every: 10
  use_gt_masks: False
  use_gt_clips: False
  match_distance_th: 0.05 #0.01
  track_th: 100
  depth_filter: True
  log: True
  sam:
    precomputed: False
    multi_crop: True
    points_per_side: 16
    sam_ckpt_path: "data/input/sam_ckpts/"
    sam_version: "2.1"
    sam_encoder: "hiera_l"
    masks_base_path: "data/working/masks/replica_384_sam2.1_16"
    #sam_version: "" # "" is 1, 
    #sam_encoder: "vit_h"
    #masks_base_path: "data/working/masks/replica_384_h"
    #nms_iou_th: 0.88
    #stability_score_thresh: 0.95
    #min_mask_region_area: 100
  clip:
    use_half: False
    embed_type: learned #TextRegion #fixed_weights # 
    model_card: SigLIP-384 #"PE-Core-L14-336" # ViT-H-14 #
    mask_res: 384 # 336 for PE Core
    weights_predictor_path: data/input/weights_predictor/base
    k_top_views: 10 #5 #10000 #-1 #
    fusion: 'l1_medoid' #'avg_pooling' #
    mv_fuser: False #True #
    mv_fuser_ckpt: "20250725_1200"
  kf_queue_delay: 10
  instance_fusion:              # which instances are the same object (ovo/entities/fusion/)
    gates: []                   # optional vetoes, e.g. [{centroid: {max_dist: 1.5}}]
    overlap:
      method: voxel             # voxel | point
      voxel: {size: 0.05, origin: [0, 0, 0]}
      point: {max_dist: 0.1}    # m
    accept:
      min_cos: 0.81             # below this, never the same
      strong: 0.5               # overlap enough on its own
      weak: 0.2                 # overlap enough if cos_sim > weak_min_cos
      weak_min_cos: 0.9
    apply: greedy               # greedy | chained
